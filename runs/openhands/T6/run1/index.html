<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モグラ叩きゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>モグラ叩きゲーム</h1>
        <div class="game-info">
            <div class="info-box">スコア: <span id="score">0</span></div>
            <div class="info-box">残り時間: <span id="timer">30</span>秒</div>
        </div>
        <button id="start-button">スタート</button>
        
        <div class="grid">
            <div class="cell" id="cell-0"><div class="mole"></div></div>
            <div class="cell" id="cell-1"><div class="mole"></div></div>
            <div class="cell" id="cell-2"><div class="mole"></div></div>
            <div class="cell" id="cell-3"><div class="mole"></div></div>
            <div class="cell" id="cell-4"><div class="mole"></div></div>
            <div class="cell" id="cell-5"><div class="mole"></div></div>
            <div class="cell" id="cell-6"><div class="mole"></div></div>
            <div class="cell" id="cell-7"><div class="mole"></div></div>
            <div class="cell" id="cell-8"><div class="mole"></div></div>
        </div>

        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <h2>ゲーム終了！</h2>
                <p>最終スコア: <span id="final-score">0</span>点</p>
                <button id="restart-button">もう一度プレイ</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
